{% extends "base.html" %}
{% block title %}Ingreso de Estudiantes{% endblock %}
{% block wrap %}narrow{% endblock %}

{% block fondo %}
<canvas id="red" aria-hidden="true"></canvas>
<script src="/static/js/red.js?v=4" defer></script>
{% endblock %}

{% block content %}
<div class="card center">
    <h2>Ingreso estudiantes</h2>
    <p class="muted">Escribe tu número de carnet para continuar.</p>

    <form action="/login" method="POST">
        <label for="carnet">Carnet</label>
        <input class="input" type="text" id="carnet" name="carnet" placeholder="Ej. 20231001" required autofocus>
        <button class="btn" type="submit">Entrar</button>
    </form>

    <p class="muted small mt">
        ¿Aún no estás registrado? <a href="/registro">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
