{% extends "base.html" %}
{% block title %}Registro de Estudiante{% endblock %}
{% block wrap %}narrow{% endblock %}

{% block fondo %}
<canvas id="red" aria-hidden="true"></canvas>
<script src="/static/js/red.js?v=7" defer></script>
{% endblock %}

{% block content %}
<div class="card">
    <h2 class="center">Crear cuenta</h2>
    <p class="muted center">El carnet es tu identificador único: garantiza un solo voto por profesor.</p>

    <form action="/registro" method="POST">
        <label for="nombre">Nombre</label>
        <input class="input" type="text" id="nombre" name="nombre" placeholder="Ej. Juan" required autofocus>

        <label for="apellido">Apellido</label>
        <input class="input" type="text" id="apellido" name="apellido" placeholder="Ej. Pérez" required>

        <label for="carnet">Número de carnet</label>
        <input class="input" type="text" id="carnet" name="carnet" placeholder="Ej. 20231001" required>

        <label for="grupo_id">Grupo</label>
        <select class="input" id="grupo_id" name="grupo_id" required>
            <option value="" disabled selected>Selecciona tu grupo</option>
            {% for g in grupos %}
            <option value="{{ g.id }}">{{ g.codigo_grupo }}</option>
            {% endfor %}
        </select>

        <button class="btn" type="submit">Registrarse y entrar</button>
    </form>

    <p class="muted small center mt mb-0"><a href="/">Volver al ingreso</a></p>
</div>
{% endblock %}
