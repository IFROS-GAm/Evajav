{% extends "base.html" %}
{% block title %}Panel de Administración{% endblock %}
{% block wrap %}narrow{% endblock %}

{% block fondo %}
<canvas id="red" aria-hidden="true"></canvas>
<script src="/static/js/red.js?v=3" defer></script>
{% endblock %}

{% block content %}
<div class="card center">
    <h2>Panel de administración</h2>
    <p class="muted">Acceso exclusivo para la coordinación académica.</p>

    <form action="/admin/login" method="POST">
        <label for="username">Usuario</label>
        <input class="input" type="text" id="username" name="username" required autofocus autocomplete="username">

        <label for="password">Contraseña</label>
        <input class="input" type="password" id="password" name="password" required autocomplete="current-password">

        <button class="btn" type="submit">Entrar al sistema</button>
    </form>

    <p class="muted small center mt mb-0"><a href="/">Soy estudiante</a></p>
</div>
{% endblock %}
