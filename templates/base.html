<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Evaluación Docente{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/neumorphism.css">
</head>
<body>
    <div id="particles-js"></div>
    <nav class="navbar-superior">
        <div class="logo">
            <strong>Evaluación Docente</strong>
        </div>
        <div class="nav-links">
            {% if request.session.get("estudiante_carnet") %}
                <span>Hola, {{ request.session.get("estudiante_nombre") }}</span>
                <a href="/logout">Salir</a>
            {% elif request.session.get("is_admin") %}
                <span>Admin Panel</span>
                <a href="/admin/logout">Salir</a>
            {% else %}
                <a href="/">Login Estudiantes</a>
            {% endif %}
        </div>
    </nav>

    <main class="container-principal">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="/static/js/particles-config.js"></script>
</body>
</html>
